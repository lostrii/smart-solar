<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Solar & Company - Modern Solar Calculator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#F26522',   /* Logo Orange */
                        secondary: '#1A78C2', /* Logo Blue */
                        dark: '#1E293B',
                        light: '#F8FAFC'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .hero-bg {
            background-image: linear-gradient(135deg, rgba(242, 101, 34, 0.92) 0%, rgba(26, 120, 194, 0.88) 55%, rgba(10, 40, 80, 0.95) 100%), url('https://images.unsplash.com/photo-1509391366360-2e959784a276?q=80&w=2072&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up { animation: fadeUp 0.8s ease-out forwards; }
        .navbar-transparent {
            background: linear-gradient(to bottom, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 100%);
            box-shadow: none;
            border-bottom: none;
        }
        .navbar-scrolled {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            box-shadow: 0 1px 20px rgba(0,0,0,0.08);
        }
    </style>
</head>
<body class="bg-light text-dark">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        // Custom Icon Component using Lucide
        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && lucide.icons[name]) {
                    const svgData = lucide.icons[name].toSvg({ width: size, height: size, class: className });
                    iconRef.current.innerHTML = svgData;
                }
            }, [name, size, className]);
            return <i ref={iconRef} className="inline-flex items-center justify-center"></i>;
        };

        // Header Component
        const Header = ({ setRoute }) => {
            const [openMenu, setOpenMenu] = useState(null);

            useEffect(() => {
                const handleClick = () => setOpenMenu(null);
                window.addEventListener('click', handleClick);
                return () => window.removeEventListener('click', handleClick);
            }, []);

            const toggleMenu = (e, menu) => {
                e.stopPropagation();
                setOpenMenu(openMenu === menu ? null : menu);
            };

            const navAction = (e, targetRoute) => {
                e.preventDefault();
                setRoute(targetRoute);
                setOpenMenu(null);
                setMobileOpen(false);
                window.scrollTo(0, 0);
            };

            const [mobileOpen, setMobileOpen] = useState(false);
            const [mobileSection, setMobileSection] = useState(null);

            const toggleMobile = (section) =>
                setMobileSection(prev => prev === section ? null : section);

            return (
                <header className="fixed w-full z-50 bg-white shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-20">

                            {/* Logo */}
                            <div className="flex items-center cursor-pointer" onClick={(e) => navAction(e, 'home')}>
                                <img src="./logo.png" alt="Smart Solar Logo" className="h-16 w-auto object-contain" />
                            </div>

                            {/* Desktop Nav */}
                            <nav className="hidden md:flex space-x-6 lg:space-x-8 relative items-center">
                                {/* Services */}
                                <div className="relative">
                                    <button onClick={(e) => toggleMenu(e, 'services')} className="flex items-center text-gray-600 hover:text-primary font-medium transition-colors">
                                        Our Services <Icon name="chevron-down" size={16} className="ml-1" />
                                    </button>
                                    {openMenu === 'services' && (
                                        <div className="absolute top-10 left-0 mt-4 w-56 bg-white rounded-xl shadow-xl border border-gray-100 py-2">
                                            <a href="#" onClick={(e) => navAction(e, 'household')} className="block px-4 py-2 hover:bg-orange-50 hover:text-primary text-gray-700 transition-colors">Household</a>
                                            <a href="#" onClick={(e) => navAction(e, 'commercial')} className="block px-4 py-2 hover:bg-orange-50 hover:text-primary text-gray-700 transition-colors">Commercial</a>
                                            <a href="#" onClick={(e) => navAction(e, 'government')} className="block px-4 py-2 hover:bg-orange-50 hover:text-primary text-gray-700 transition-colors">Government Institution</a>
                                        </div>
                                    )}
                                </div>
                                {/* Solutions */}
                                <div className="relative">
                                    <button onClick={(e) => toggleMenu(e, 'solutions')} className="flex items-center text-gray-600 hover:text-primary font-medium transition-colors">
                                        Solutions <Icon name="chevron-down" size={16} className="ml-1" />
                                    </button>
                                    {openMenu === 'solutions' && (
                                        <div className="absolute top-10 left-0 mt-4 w-48 bg-white rounded-xl shadow-xl border border-gray-100 py-2">
                                            <a href="#" onClick={(e) => navAction(e, 'on-grid-solar')} className="block px-4 py-2 hover:bg-emerald-50 text-gray-700">On-Grid Solar</a>
                                            <a href="#" onClick={(e) => navAction(e, 'off-grid-solar')} className="block px-4 py-2 hover:bg-emerald-50 text-gray-700">Off-Grid Solar</a>
                                            <a href="#" onClick={(e) => navAction(e, 'hybrid-solar')} className="block px-4 py-2 hover:bg-emerald-50 text-gray-700">Hybrid Solar</a>
                                            <a href="#" onClick={(e) => navAction(e, 'loan-finance')} className="block px-4 py-2 hover:bg-emerald-50 text-gray-700">Loan &amp; Finance</a>
                                        </div>
                                    )}
                                </div>
                                {/* Location */}
                                <div className="relative">
                                    <button onClick={(e) => toggleMenu(e, 'location')} className="flex items-center text-gray-600 hover:text-primary font-medium transition-colors">
                                        Our Location <Icon name="chevron-down" size={16} className="ml-1" />
                                    </button>
                                    {openMenu === 'location' && (
                                        <div className="absolute top-10 left-0 mt-4 w-44 bg-white rounded-xl shadow-xl border border-gray-100 py-2">
                                            {[['Lucknow','lucknow'],['Gorakhpur','gorakhpur'],['Varanasi','varanasi'],['Delhi NCR','delhi-ncr'],['Bareilly','bareilly']].map(([city, r]) => (
                                                <a key={city} href="#" onClick={(e) => { e.preventDefault(); setOpenMenu(null); setRoute(r); window.scrollTo({top:0}); }} className="block px-4 py-2 hover:bg-emerald-50 text-gray-700 flex items-center justify-between">
                                                    {city} <Icon name="chevron-right" size={13} className="text-primary" />
                                                </a>
                                            ))}
                                        </div>
                                    )}
                                </div>
                                <a href="#" onClick={(e) => navAction(e, 'about')} className="text-gray-600 hover:text-primary font-medium transition-colors">About Us</a>
                            </nav>

                            {/* Desktop CTA */}
                            <div className="hidden md:flex items-center space-x-4">
                                <a href="#contact" onClick={(e) => { e.preventDefault(); setRoute('home'); setTimeout(() => { document.getElementById('contact').scrollIntoView({behavior: 'smooth'}); }, 100); }} className="bg-primary hover:bg-orange-600 text-white px-6 py-2.5 rounded-full font-medium transition-all shadow-lg hover:shadow-xl transform hover:-translate-y-0.5">
                                    Get Consultation
                                </a>
                            </div>

                            {/* Mobile menu toggle — CSS hamburger → X (md:hidden keeps desktop unchanged) */}
                            <button
                                type="button"
                                className="md:hidden ml-auto flex items-center justify-center w-11 h-11 shrink-0 rounded-xl border border-gray-200 bg-white text-gray-900 shadow-sm hover:bg-gray-50 hover:border-gray-300 active:scale-[0.98] transition-all duration-200 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-primary focus-visible:ring-offset-2"
                                onClick={() => { setMobileOpen((o) => !o); setMobileSection(null); }}
                                aria-expanded={mobileOpen}
                                aria-controls="mobile-nav-drawer"
                                aria-label={mobileOpen ? 'Close navigation menu' : 'Open navigation menu'}
                            >
                                <span className="relative block h-5 w-6" aria-hidden="true">
                                    <span
                                        className={`absolute left-0 block h-0.5 w-6 rounded-full bg-gray-900 transition-all duration-300 ease-out ${mobileOpen ? 'top-[9px] rotate-45' : 'top-0 rotate-0'}`}
                                    />
                                    <span
                                        className={`absolute left-0 top-[9px] block h-0.5 w-6 rounded-full bg-gray-900 transition-all duration-300 ease-out ${mobileOpen ? 'opacity-0 scale-0' : 'opacity-100 scale-100'}`}
                                    />
                                    <span
                                        className={`absolute left-0 block h-0.5 w-6 rounded-full bg-gray-900 transition-all duration-300 ease-out ${mobileOpen ? 'top-[9px] -rotate-45' : 'top-[18px] rotate-0'}`}
                                    />
                                </span>
                            </button>
                        </div>
                    </div>

                    {/* Mobile Drawer */}
                    {mobileOpen && (
                        <div id="mobile-nav-drawer" className="md:hidden bg-white border-t border-gray-100 shadow-xl px-4 py-4 space-y-1 max-h-screen overflow-y-auto transition-opacity duration-200">

                            {/* Our Services */}
                            <div>
                                <button onClick={() => toggleMobile('services')} className="w-full flex items-center justify-between px-3 py-3 rounded-xl font-semibold text-gray-700 hover:bg-orange-50 hover:text-primary transition-colors">
                                    Our Services
                                    <Icon name={mobileSection === 'services' ? 'chevron-up' : 'chevron-down'} size={16} />
                                </button>
                                {mobileSection === 'services' && (
                                    <div className="pl-4 mt-1 space-y-1">
                                        {[['Household','household'],['Commercial','commercial'],['Government Institution','government']].map(([label, r]) => (
                                            <a key={r} href="#" onClick={(e) => navAction(e, r)} className="block px-3 py-2.5 rounded-lg text-gray-600 hover:bg-orange-50 hover:text-primary transition-colors text-sm">{label}</a>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Solutions */}
                            <div>
                                <button onClick={() => toggleMobile('solutions')} className="w-full flex items-center justify-between px-3 py-3 rounded-xl font-semibold text-gray-700 hover:bg-emerald-50 hover:text-emerald-700 transition-colors">
                                    Solutions
                                    <Icon name={mobileSection === 'solutions' ? 'chevron-up' : 'chevron-down'} size={16} />
                                </button>
                                {mobileSection === 'solutions' && (
                                    <div className="pl-4 mt-1 space-y-1">
                                        {[['On-Grid Solar','on-grid-solar'],['Off-Grid Solar','off-grid-solar'],['Hybrid Solar','hybrid-solar'],['Loan & Finance','loan-finance']].map(([label, r]) => (
                                            <a key={r} href="#" onClick={(e) => navAction(e, r)} className="block px-3 py-2.5 rounded-lg text-gray-600 hover:bg-emerald-50 hover:text-emerald-700 transition-colors text-sm">{label}</a>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* Location */}
                            <div>
                                <button onClick={() => toggleMobile('location')} className="w-full flex items-center justify-between px-3 py-3 rounded-xl font-semibold text-gray-700 hover:bg-blue-50 hover:text-blue-700 transition-colors">
                                    Our Location
                                    <Icon name={mobileSection === 'location' ? 'chevron-up' : 'chevron-down'} size={16} />
                                </button>
                                {mobileSection === 'location' && (
                                    <div className="pl-4 mt-1 space-y-1">
                                        {[['Lucknow','lucknow'],['Gorakhpur','gorakhpur'],['Varanasi','varanasi'],['Delhi NCR','delhi-ncr'],['Bareilly','bareilly']].map(([city, r]) => (
                                            <a key={city} href="#" onClick={(e) => { e.preventDefault(); setMobileOpen(false); setRoute(r); window.scrollTo({top:0}); }} className="block px-3 py-2.5 rounded-lg text-gray-600 hover:bg-blue-50 hover:text-blue-700 transition-colors text-sm flex items-center justify-between">
                                                {city} <Icon name="chevron-right" size={13} className="text-primary" />
                                            </a>
                                        ))}
                                    </div>
                                )}
                            </div>

                            {/* About Us */}
                            <a href="#" onClick={(e) => navAction(e, 'about')} className="block px-3 py-3 rounded-xl font-semibold text-gray-700 hover:bg-gray-100 transition-colors">About Us</a>

                            {/* Divider */}
                            <div className="border-t border-gray-100 my-2" />

                            {/* CTA */}
                            <a href="#" onClick={(e) => { e.preventDefault(); setMobileOpen(false); setRoute('consultation'); window.scrollTo({top:0}); }}
                                className="block w-full text-center bg-primary hover:bg-orange-600 text-white px-6 py-3.5 rounded-xl font-bold transition-all shadow-lg">
                                📞 Get Free Consultation
                            </a>
                        </div>
                    )}
                </header>
            );
        };

        // Hero Slider Component
        const Hero = () => {
            const slides = [
                {
                    headline: "Power Your Home With Smart Solar",
                    subtitle: "Join the renewable energy revolution. Calculate your exact savings, lower your electricity bills to zero, and increase your property value instantly.",
                    image: "https://images.unsplash.com/photo-1509391366360-2e959784a276?q=80&w=2072&auto=format&fit=crop",
                    badge: "THE FUTURE OF ENERGY",
                    isBrand: true
                },
                {
                    headline: "Don't Pay for Power—Produce It",
                    subtitle: "Switch to solar and take control of your energy costs.",
                    image: "https://images.unsplash.com/photo-1548337138-e87d889cc369?q=80&w=2072&auto=format&fit=crop",
                    badge: "TAKE CONTROL"
                },
                {
                    headline: "Your Roof Can Save You Money",
                    subtitle: "Turn sunlight into electricity and cut your bills.",
                    image: "https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?q=80&w=2072&auto=format&fit=crop",
                    badge: "SMART INVESTMENT"
                },
                {
                    headline: "Electricity Bills? There's a Better Way",
                    subtitle: "Switch to solar today.",
                    image: "https://images.unsplash.com/photo-1613665813446-82a78c468a1d?q=80&w=2072&auto=format&fit=crop",
                    badge: "GO GREEN"
                },
                {
                    headline: "Save Today. Save Tomorrow.",
                    subtitle: "Reliable solar power, long-term savings.",
                    image: "https://images.unsplash.com/photo-1592833159155-c62df1b65634?q=80&w=2072&auto=format&fit=crop",
                    badge: "LONG-TERM VALUE"
                }
            ];

            const [current, setCurrent] = useState(0);
            const [animating, setAnimating] = useState(false);

            useEffect(() => {
                const timer = setInterval(() => {
                    goTo((current + 1) % slides.length);
                }, 5000);
                return () => clearInterval(timer);
            }, [current]);

            const goTo = (idx) => {
                if (animating) return;
                setAnimating(true);
                setTimeout(() => setAnimating(false), 700);
                setCurrent(idx);
            };

            const s = slides[current];

            return (
                <section className="relative min-h-screen flex items-center pt-20 overflow-hidden">
                    {/* Background Images with Transition */}
                    {slides.map((slide, i) => (
                        <div
                            key={i}
                            className="absolute inset-0 transition-opacity duration-700"
                            style={{
                                opacity: i === current ? 1 : 0,
                                backgroundImage: `linear-gradient(135deg, rgba(242,101,34,0.82) 0%, rgba(26,120,194,0.78) 55%, rgba(10,30,70,0.92) 100%), url('${slide.image}')`,
                                backgroundSize: 'cover',
                                backgroundPosition: 'center',
                                zIndex: 0
                            }}
                        />
                    ))}

                    {/* Content */}
                    <div className="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full text-center">
                        <div
                            key={current}
                            className="animate-fade-up"
                        >
                            <span className="bg-white/20 border border-white/40 text-white px-4 py-1.5 rounded-full text-sm font-semibold tracking-widest mb-6 inline-block uppercase">
                                {s.badge}
                            </span>
                            <h1 className="text-5xl md:text-7xl font-extrabold text-white mb-6 leading-tight drop-shadow-lg">
                                {s.isBrand ? (
                                    <>Power Your Home With <br/><span className="text-transparent bg-clip-text bg-gradient-to-r from-orange-300 to-blue-200">Smart Solar</span></>
                                ) : s.headline}
                            </h1>
                            <p className="text-xl md:text-2xl text-white/90 max-w-2xl mx-auto mb-10 leading-relaxed font-medium">
                                {s.subtitle}
                            </p>
                            <div className="flex flex-col sm:flex-row justify-center gap-4">
                                <a href="#calculator" className="bg-white text-primary hover:bg-orange-50 px-8 py-4 rounded-full font-bold text-lg transition-all shadow-xl flex items-center justify-center">
                                    Calculate Savings <Icon name="arrow-right" size={20} className="ml-2" />
                                </a>
                                <a href="#contact" className="bg-white/15 hover:bg-white/25 backdrop-blur text-white px-8 py-4 rounded-full font-bold text-lg transition-all border border-white/50">
                                    Get Free Consultation
                                </a>
                            </div>
                        </div>

                        {/* Dot Indicators */}
                        <div className="flex justify-center gap-3 mt-14">
                            {slides.map((_, i) => (
                                <button
                                    key={i}
                                    onClick={() => goTo(i)}
                                    className={`transition-all duration-300 rounded-full ${i === current ? 'w-8 h-3 bg-white' : 'w-3 h-3 bg-white/40 hover:bg-white/70'}`}
                                />
                            ))}
                        </div>
                    </div>

                    {/* Prev / Next — clear arrow icons (SVG) on brand buttons */}
                    <button
                        type="button"
                        aria-label="Previous slide"
                        onClick={() => goTo((current - 1 + slides.length) % slides.length)}
                        className="absolute left-2 sm:left-6 top-1/2 -translate-y-1/2 z-20 flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white shadow-xl border-2 border-white/30 transition-all duration-200 hover:bg-orange-600 hover:shadow-2xl active:scale-95 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900/70"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                            <path d="M15 18l-6-6 6-6" />
                        </svg>
                    </button>
                    <button
                        type="button"
                        aria-label="Next slide"
                        onClick={() => goTo((current + 1) % slides.length)}
                        className="absolute right-2 sm:right-6 top-1/2 -translate-y-1/2 z-20 flex h-12 w-12 items-center justify-center rounded-full bg-primary text-white shadow-xl border-2 border-white/30 transition-all duration-200 hover:bg-orange-600 hover:shadow-2xl active:scale-95 cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-white focus-visible:ring-offset-2 focus-visible:ring-offset-slate-900/70"
                    >
                        <svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" aria-hidden="true">
                            <path d="M9 18l6-6-6-6" />
                        </svg>
                    </button>
                </section>
            );
        };

        // Solar Solutions Showcase (reference-style card section)
        const SolarSolutionsShowcase = ({ setRoute, addLead }) => {
            const [loanForm, setLoanForm] = useState({ name: '', phone: '', email: '', city: '', loanAmount: '', message: '' });
            const [loanSubmitted, setLoanSubmitted] = useState(false);

            const handleLoanSubmit = (e) => {
                e.preventDefault();
                const amountNum = Number(loanForm.loanAmount);
                if (!Number.isFinite(amountNum) || amountNum <= 0) return;

                addLead({
                    id: Date.now(),
                    date: new Date().toLocaleDateString(),
                    tag: 'Loan Request',
                    name: loanForm.name,
                    phone: loanForm.phone,
                    email: loanForm.email,
                    city: loanForm.city,
                    loanAmount: amountNum,
                    loan_amount: amountNum,
                    message: loanForm.message || ''
                });

                setLoanSubmitted(true);
                setTimeout(() => {
                    setLoanSubmitted(false);
                    setLoanForm({ name: '', phone: '', email: '', city: '', loanAmount: '', message: '' });
                }, 3000);
            };

            const solutions = [
                {
                    label: 'Household',
                    image: 'https://images.unsplash.com/photo-1508514177221-188b1cf16e9d?q=80&w=800&auto=format&fit=crop',
                    route: 'household',
                    desc: 'Premium solar for your home'
                },
                {
                    label: 'Commercial',
                    image: 'https://images.unsplash.com/photo-1548337138-e87d889cc369?q=80&w=800&auto=format&fit=crop',
                    route: 'commercial',
                    desc: 'High-efficiency business solar'
                },
                {
                    label: 'Government Institution',
                    image: 'https://images.unsplash.com/photo-1486325212027-8081e485255e?q=80&w=800&auto=format&fit=crop',
                    route: 'government',
                    desc: 'Reliable solar for public sector'
                }
                ,
                {
                    label: 'Loan & Finance',
                    image: 'https://images.unsplash.com/photo-1554224155-6726b3ff858f?q=80&w=800&auto=format&fit=crop',
                    route: 'loan-finance',
                    desc: 'Easy financing with loan assistance'
                }
            ];

            return (
                <section style={{ background: '#0f1f5c' }} className="py-16 px-4 sm:px-8 lg:px-16">
                    <div className="max-w-7xl mx-auto">
                        <h2 className="text-3xl md:text-4xl font-bold text-white mb-10">Our solar solutions</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-5">
                            {solutions.map((s, i) => (
                                <div
                                    key={i}
                                    onClick={() => { setRoute(s.route); window.scrollTo(0,0); }}
                                    className="relative cursor-pointer group overflow-hidden rounded-2xl"
                                    style={{ height: '380px' }}
                                >
                                    {/* Image */}
                                    <img
                                        src={s.image}
                                        alt={s.label}
                                        className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
                                    />
                                    {/* Overlay on hover */}
                                    <div className="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent transition-opacity duration-300 group-hover:from-black/80" />
                                    {/* Arrow indicator */}
                                    <div className="absolute top-4 right-4 w-10 h-10 bg-white/20 backdrop-blur-sm rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 transform group-hover:scale-110">
                                        <Icon name="arrow-right" size={18} className="text-white" />
                                    </div>
                                    {/* Label */}
                                    <div className="absolute bottom-0 left-0 right-0 p-6">
                                        <p className="text-white/70 text-sm mb-1">{s.desc}</p>
                                        <p className="text-white font-bold text-xl tracking-wide">{s.label}</p>
                                    </div>
                                </div>
                            ))}

        // Savings Chart Component
        const SavingsChart = ({ annualSavings, cost }) => {
            const chartRef = useRef(null);
            const chartInstance = useRef(null);

            useEffect(() => {

                    chartInstance.current.destroy();

                const ctx = chartRef.current.getContext('2d');
                const years = Array.from({length: 26}, (_, i) => i);
                const cumulativeSavings = years.map(year => year * annualSavings);
                const costLine = years.map(() => cost);

                chartInstance.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: years,
                        datasets: [
                            {
                                label: 'Cumulative Savings (₹)',
                                data: cumulativeSavings,
                                borderColor: '#10B981',
                                backgroundColor: 'rgba(16, 185, 129, 0.1)',
                                fill: true,
                                tension: 0.4

                            {

                                data: costLine,
                                borderColor: '#EF4444',
                                borderDash: [5, 5],
                                fill: false,
                                pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: {
                            intersect: false,
                            mode: 'index',
                        },
                        plugins: {
                            legend: { position: 'top' },
                            tooltip: {
                                callbacks: {
                                    label: function(context) {
                                        let label = context.dataset.label || '';
                                        if (label) { label += ': '; }
                                        if (context.parsed.y !== null) {
                                            label += new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumSignificantDigits: 3 }).format(context.parsed.y);
                                        }
                                        return label;
                                    }
                                }
                            }
                        },
                        scales: {
                            y: {
                                ticks: {
                                    callback: function(value) { return '₹' + (value/100000).toFixed(1) + 'L'; }
                                }
                            },
                            x: { title: { display: true, text: 'Years' } }
                        }
                    }
                });

                return () => {
                    if (chartInstance.current) chartInstance.current.destroy();
                };
            }, [annualSavings, cost]);

            return <div className="h-64 w-full"><canvas ref={chartRef}></canvas></div>;
        };

        // Calculator Section
        const CalculatorSection = () => {
            const [bill, setBill] = useState(5000);
            const [propertyType, setPropertyType] = useState('residential');
            const [location, setLocation] = useState('');
            const [isLocating, setIsLocating] = useState(false);
            const [locError, setLocError] = useState('');
            const [activeTab, setActiveTab] = useState('without'); // 'without' | 'with'

            // --- Core Calculations ---
            const COST_PER_KW = 60000;
            const SAVINGS_PER_KW_YEAR = 11000;

            // System size in kW (rounded to 1 decimal)
            const systemSize = parseFloat(((bill / 1000) * 1.2).toFixed(1));

            // Subsidy logic (Government of India rooftop solar scheme)
            const getSubsidy = (kw) => {
                if (kw <= 0) return 0;
                if (kw < 1.5) return 45000;       // 1 kW slab
                if (kw < 2.5) return 90000;       // 2 kW slab
                return 108000;                     // 3 kW and above cap
            };
            const subsidy = getSubsidy(systemSize);

            // Without subsidy
            const grossCost          = systemSize * COST_PER_KW;
            const annualSavings      = systemSize * SAVINGS_PER_KW_YEAR;
            const monthlySavings     = annualSavings / 12;
            const paybackPeriod      = annualSavings > 0 ? grossCost / annualSavings : 0;
            const total25Year        = annualSavings * 25;

            // With subsidy
            const netCost            = Math.max(0, grossCost - subsidy);
            const paybackWithSub     = annualSavings > 0 ? netCost / annualSavings : 0;

            const formatINR = (n) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(n);

            const detectLocation = async () => {
                setLocError('');
                setIsLocating(true);

                try {
                    if (!navigator.geolocation) {
                        throw new Error('Geolocation not supported');
                    }

                    const position = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 12000,
                            maximumAge: 60_000
                        });
                    });

                    const { latitude, longitude } = position.coords || {};
                    if (typeof latitude !== 'number' || typeof longitude !== 'number') {
                        throw new Error('Could not read coordinates');
                    }

                    // Reverse geocode via OpenStreetMap Nominatim (no API key required).
                    const url = `https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=${encodeURIComponent(latitude)}&lon=${encodeURIComponent(longitude)}`;
                    const res = await fetch(url, {
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                    if (!res.ok) throw new Error('Reverse lookup failed');
                    const data = await res.json();

                    const a = (data && data.address) ? data.address : {};
                    const city =
                        a.city || a.town || a.village || a.suburb || a.county || a.state_district || '';
                    const state = a.state || '';
                    const country = a.country || '';

                    const label = [city, state].filter(Boolean).join(', ') || data.display_name || '';
                    if (!label) throw new Error('Could not detect location');

                    setLocation(label);
                } catch (e) {
                    // If GPS is blocked/denied, fall back to approximate IP-based city lookup.
                    // (Less accurate than GPS, but works reliably without permission.)
                    try {
                        const msg = (e && e.message) ? String(e.message) : '';
                        // Standard geolocation errors often include "User denied Geolocation".
                        if (msg.toLowerCase().includes('denied')) {
                            setLocError('Location permission denied. Using approximate location...');
                        }

                        const ipRes = await fetch('https://ipapi.co/json/', { headers: { 'Accept': 'application/json' } });
                        if (!ipRes.ok) throw new Error('ip lookup failed');
                        const ipData = await ipRes.json();
                        const city = ipData.city || '';
                        const region = ipData.region || ipData.region_code || '';
                        const label = [city, region].filter(Boolean).join(', ');
                        if (label) {
                            setLocation(label);
                            setLocError('');
                        } else {
                            setLocError('Could not detect location automatically. Please type your city manually.');
                        }
                    } catch {
                        setLocError('Could not detect location automatically. Please type your city manually.');
                    }
                } finally {
                    setIsLocating(false);
                }
            };

                                    <Icon name="building" size={20} className="mr-2" /> Commercial
                                </button>
                            </div>
                        </div>
                        {/* Location */}
                        <div>
                            <label className="font-semibold text-gray-700 block mb-2">Installation Location</label>
                            <div className="flex gap-2 relative">
                                <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none"><Icon name="map-pin" size={20} className="text-gray-400" /></div>
                                <input type="text" placeholder="Enter your city" value={location}
                                    onChange={(e) => setLocation(e.target.value)}
                                    className="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-primary focus:border-primary outline-none" />
                                <button type="button" onClick={detectLocation} className="bg-gray-100 hover:bg-gray-200 text-gray-700 px-4 rounded-xl border border-gray-300 transition-colors flex items-center whitespace-nowrap cursor-pointer">
                                    {isLocating ? 'Detecting...' : <><Icon name="crosshair" size={18} className="mr-1" />Auto</>}
                                </button>
                            </div>
                            {locError && <p className="mt-2 text-xs text-red-600 font-semibold">{locError}</p>}
                        </div>
                        {/* System Size Preview */}
                        <div className="bg-white rounded-2xl border border-gray-200 p-4 flex items-center justify-between">

                            <p className="text-xl text-gray-600">Compare costs with and without the Government of India rooftop subsidy.</p>
                        </div>

                        {/* Tab Toggle */}
                        <div className="flex justify-center mb-8">
                            <div className="inline-flex bg-white border border-gray-200 rounded-2xl p-1.5 shadow-sm gap-1">
                                <button
                                    onClick={() => setActiveTab('without')}
                                    className={`px-8 py-3 rounded-xl font-semibold text-sm transition-all ${activeTab === 'without' ? 'bg-primary text-white shadow-md' : 'text-gray-600 hover:text-primary'}`}>
                                    Without Subsidy

                                <button

                            </div>

                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-0 bg-white rounded-3xl shadow-xl overflow-hidden border border-gray-100">

                            {/* Results Panel */}

                                {activeTab === 'without' ? (
                                    <>
                                        <h3 className="text-2xl font-bold mb-2 flex items-center"><Icon name="bar-chart-2" className="mr-3 text-primary" /> Without Subsidy</h3>
                                        <p className="text-gray-500 text-sm mb-8">Standard estimated cost at ₹60,000/kW — no government benefit applied.</p>
                                        <div className="grid grid-cols-2 gap-5 mb-8">
                                            <div className="bg-blue-50 rounded-2xl p-4 border border-blue-100">
                                                <p className="text-blue-700 text-xs font-semibold mb-1 uppercase tracking-wide">Total Cost</p>
                                                <p className="text-2xl font-extrabold text-blue-900">{formatINR(grossCost)}</p>
                                            </div>
                                            <div className="bg-emerald-50 rounded-2xl p-4 border border-emerald-100">
                                                <p className="text-emerald-700 text-xs font-semibold mb-1 uppercase tracking-wide">Monthly Savings</p>
                                                <p className="text-2xl font-extrabold text-emerald-900">{formatINR(monthlySavings)}</p>
